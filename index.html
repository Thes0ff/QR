<script>
  // Публичный ID для чтения имени магазина и ссылки на карты
  // (секретные токены ботов сюда НЕ попадают)
  const GIST_ID = "ВАШ_GIST_ID"; 

  const labels = {
    1: "😡 Ужасный сервис",
    2: "🙁 Не понравилось",
    3: "😐 Есть замечания",
    4: "🙂 Хорошо",
    5: "🔥 Превосходно!"
  };

  const urlParams = new URLSearchParams(window.location.search);
  const shopId = urlParams.get('id') || '001';
  let shopConfig = null;
  let selectedRating = 0;
  let selectedTags = [];

  // Загружаем конфиг для редиректа на карты
  fetch(`https://api.github.com/gists/${GIST_ID}`)
    .then(r => r.json())
    .then(data => {
      const shops = JSON.parse(data.files['shops.json'].content || '{}');
      if (shops[shopId]) {
        shopConfig = shops[shopId];
        document.getElementById('shopName').innerText = shopConfig.name;
      }
    })
    .catch(err => console.error("Ошибка загрузки:", err));

  const buttons = document.querySelectorAll('.star-btn');
  buttons.forEach((btn, idx) => {
    btn.addEventListener('click', () => {
      selectedRating = idx + 1;
      const pill = document.getElementById('ratingText');
      pill.innerText = labels[selectedRating];
      pill.style.color = selectedRating >= 4 ? '#38bdf8' : '#fda4af';

      buttons.forEach((b, i) => {
        b.classList.toggle('active', i <= idx);
      });

      if (selectedRating >= 4) {
        document.getElementById('ratingBox').style.display = 'none';
        document.getElementById('redirectBlock').style.display = 'block';
        setTimeout(() => {
          window.location.href = (shopConfig && shopConfig.maps_url) ? shopConfig.maps_url : 'https://yandex.ru/maps';
        }, 850);
      } else {
        document.getElementById('negativeForm').style.display = 'block';
      }
    });
  });

  function toggleTag(el) {
    el.classList.toggle('selected');
    const text = el.innerText;
    if (selectedTags.includes(text)) {
      selectedTags = selectedTags.filter(t => t !== text);
    } else {
      selectedTags.push(text);
    }
  }

  async function submitComplaint() {
    const comment = document.getElementById('comment').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const btn = document.getElementById('btnSend');

    btn.disabled = true;
    btn.innerText = "Отправка...";

    try {
      // Отправляем данные на наш защищенный бессерверный бэкенд
      await fetch('/api/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          shopId: shopId,
          rating: selectedRating,
          tags: selectedTags,
          comment: comment,
          phone: phone
        })
      });
    } catch (e) {
      console.error("Ошибка сети:", e);
    }

    document.getElementById('headerBox').style.display = 'none';
    document.getElementById('ratingBox').style.display = 'none';
    document.getElementById('negativeForm').style.display = 'none';
    document.getElementById('successBlock').style.display = 'block';
  }
</script>
