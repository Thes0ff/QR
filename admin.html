<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; padding: 16px; margin: 0; }
    .card { background: #1e293b; width: 100%; max-width: 440px; padding: 24px; border-radius: 16px; border: 1px solid #334155; }
    h2 { margin: 0 0 16px 0; font-size: 20px; }
    label { display: block; font-size: 12px; text-transform: uppercase; color: #94a3b8; margin-bottom: 5px; font-weight: 600; }
    input { width: 100%; background: #0f172a; border: 1px solid #334155; color: #fff; padding: 12px; border-radius: 10px; font-size: 14px; margin-bottom: 14px; outline: none; }
    input:focus { border-color: #38bdf8; }
    .channel-box { background: rgba(15, 23, 42, 0.6); padding: 14px; border-radius: 12px; border: 1px solid #334155; margin-bottom: 16px; }
    .channel-title { font-size: 13px; font-weight: 700; color: #38bdf8; margin-bottom: 10px; text-transform: uppercase; }
    button { width: 100%; background: #38bdf8; color: #0f172a; border: none; padding: 14px; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; }
    .status { margin-top: 12px; padding: 10px; border-radius: 8px; font-size: 13px; text-align: center; display: none; }
    .success { background: rgba(34, 197, 94, 0.15); color: #4ade80; }
    .error { background: rgba(239, 68, 68, 0.15); color: #f87171; }
    details { margin-bottom: 18px; border-bottom: 1px solid #334155; padding-bottom: 12px; }
    summary { font-size: 13px; color: #38bdf8; cursor: pointer; }
  </style>
</head>
<body>

<div class="card">
  <h2>Активация стойки</h2>

  <details>
    <summary>Ключи доступа (Gist + Token)</summary>
    <div style="margin-top: 10px;">
      <label>GitHub Gist ID</label>
      <input type="text" id="gistId" placeholder="Хеш из адреса Gist">
      <label>GitHub Personal Token</label>
      <input type="password" id="ghToken" placeholder="ghp_...">
    </div>
  </details>

  <label>Номер стойки (ID из QR)</label>
  <input type="text" id="shopId" placeholder="Например: 001">

  <label>Название точки</label>
  <input type="text" id="shopName" placeholder="Кофейня «Утро»">

  <label>Ссылка на Яндекс.Карты / 2ГИС</label>
  <input type="url" id="mapsUrl" placeholder="https://yandex.ru/maps/org/...">

  <!-- Блок выбора каналов уведомлений -->
  <div class="channel-box">
    <div class="channel-title">Куда слать негатив (заполните нужные):</div>

    <label>Telegram (Chat ID)</label>
    <input type="text" id="targetTg" placeholder="Например: 123456789">

    <label>ВКонтакте (VK User ID)</label>
    <input type="text" id="targetVk" placeholder="Например: 74829102">

    <label>Электронная почта (Email)</label>
    <input type="email" id="targetEmail" placeholder="director@mail.ru">
  </div>

  <button onclick="saveShop()" id="btnSave">Привязать стойку</button>
  <div id="status" class="status"></div>
</div>

<script>
  document.getElementById('gistId').value = localStorage.getItem('cfg_gist_id') || '';
  document.getElementById('ghToken').value = localStorage.getItem('cfg_gh_token') || '';

  async function saveShop() {
    const status = document.getElementById('status');
    const btn = document.getElementById('btnSave');
    status.style.display = 'none';

    const gistId = document.getElementById('gistId').value.trim();
    const token = document.getElementById('ghToken').value.trim();
    const shopId = document.getElementById('shopId').value.trim();
    const name = document.getElementById('shopName').value.trim();
    const mapsUrl = document.getElementById('mapsUrl').value.trim();

    const targetTg = document.getElementById('targetTg').value.trim();
    const targetVk = document.getElementById('targetVk').value.trim();
    const targetEmail = document.getElementById('targetEmail').value.trim();

    if (!gistId || !token || !shopId || !name || !mapsUrl) {
      showStatus('Заполните основные данные точки!', false);
      return;
    }

    if (!targetTg && !targetVk && !targetEmail) {
      showStatus('Укажите хотя бы один контакт (Telegram, VK или Email)!', false);
      return;
    }

    localStorage.setItem('cfg_gist_id', gistId);
    localStorage.setItem('cfg_gh_token', token);

    btn.disabled = true;
    btn.innerText = 'Сохранение...';

    try {
      const resGet = await fetch(`https://api.github.com/gists/${gistId}`, {
        headers: { 'Authorization': `token ${token}` }
      });
      const gistData = await resGet.json();
      let shops = JSON.parse(gistData.files['shops.json'].content || '{}');

      // Сохраняем объект с активными каналами
      shops[shopId] = {
        name: name,
        maps_url: mapsUrl,
        targets: {
          telegram: targetTg || null,
          vk: targetVk || null,
          email: targetEmail || null
        }
      };

      const resPatch = await fetch(`https://api.github.com/gists/${gistId}`, {
        method: 'PATCH',
        headers: {
          'Authorization': `token ${token}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          files: { 'shops.json': { content: JSON.stringify(shops, null, 2) } }
        })
      });

      if (resPatch.ok) {
        showStatus(`Стойка №${shopId} успешно настроена!`, true);
        document.getElementById('shopId').value = '';
        document.getElementById('shopName').value = '';
        document.getElementById('mapsUrl').value = '';
        document.getElementById('targetTg').value = '';
        document.getElementById('targetVk').value = '';
        document.getElementById('targetEmail').value = '';
      } else {
        showStatus('Ошибка GitHub API: проверьте токен', false);
      }
    } catch (e) {
      showStatus('Ошибка соединения с GitHub', false);
    } finally {
      btn.disabled = false;
      btn.innerText = 'Привязать стойку';
    }
  }

  function showStatus(text, ok) {
    const el = document.getElementById('status');
    el.className = `status ${ok ? 'success' : 'error'}`;
    el.innerText = text;
    el.style.display = 'block';
  }
</script>
</body>
</html>
