<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Активация стойки — Панель управления</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(17, 24, 39, 0.85);
      --border: rgba(255, 255, 255, 0.08);
      --border-focus: #38bdf8;
      --accent: #38bdf8;
      --accent-grad: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: rgba(15, 23, 42, 0.6);
      --channel-bg: rgba(15, 23, 42, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.12) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(15, 23, 42, 0.85) 0px, transparent 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 16px;
      color: var(--text);
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      width: 100%;
      max-width: 440px;
      border-radius: 24px;
      padding: 30px 24px;
      border: 1px solid var(--border);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .top-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.2);
      color: var(--accent);
      padding: 5px 12px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .badge-glow {
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent);
    }

    h2 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
      margin-bottom: 18px;
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .btn-logout {
      background: rgba(244, 63, 94, 0.12);
      border: 1px solid rgba(244, 63, 94, 0.25);
      color: #fda4af;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-logout:hover {
      background: rgba(244, 63, 94, 0.22);
    }

    details {
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 14px;
    }

    summary {
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
      cursor: pointer;
      user-select: none;
      outline: none;
    }

    .keys-box {
      margin-top: 14px;
    }

    label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 600;
    }

    input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 14px;
      color: #fff;
      outline: none;
      margin-bottom: 14px;
      transition: all 0.2s ease;
    }

    input:focus {
      border-color: var(--border-focus);
      background: rgba(15, 23, 42, 0.9);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }

    .remember-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 18px;
      cursor: pointer;
      user-select: none;
    }

    .remember-row input {
      width: auto;
      margin-bottom: 0;
      cursor: pointer;
    }

    .remember-row span {
      font-size: 13px;
      color: var(--text-muted);
    }

    .channels-card {
      background: var(--channel-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 18px;
    }

    .channels-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .channels-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--accent);
    }

    .channels-hint {
      font-size: 11px;
      color: var(--text-muted);
    }

    .btn-submit {
      width: 100%;
      background: var(--accent-grad);
      color: #0f172a;
      border: none;
      padding: 15px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 20px -5px rgba(56, 189, 248, 0.35);
      transition: all 0.2s ease;
    }

    .btn-submit:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    .btn-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .status-box {
      margin-top: 16px;
      padding: 16px;
      border-radius: 14px;
      font-size: 13px;
      text-align: left;
      display: none;
      line-height: 1.5;
    }

    .status-ok {
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
    }

    .status-err {
      background: rgba(244, 63, 94, 0.15);
      border: 1px solid rgba(244, 63, 94, 0.3);
      color: #fda4af;
      text-align: center;
    }

    .link-container {
      margin-top: 10px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .link-text {
      color: #38bdf8;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      word-break: break-all;
    }

    .btn-copy {
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #38bdf8;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
  </style>
</head>
<body>

  <!-- ==========================================================
       ЭКРАН 1: АВТОРИЗАЦИЯ (Проверка через Vercel API)
       ========================================================== -->
  <div class="card" id="authCard" style="display: none;">
    <div class="top-badge">
      <span class="badge-glow"></span>
      Доступ ограничен
    </div>
    <h2>Вход в панель</h2>
    <p style="font-size: 13px; color: var(--text-muted); line-height: 1.5; margin-bottom: 20px;">
      Для активации стоек введите мастер-пароль администратора:
    </p>

    <label>Мастер-пароль</label>
    <input type="password" id="adminPassInput" placeholder="••••••••" onkeydown="if(event.key==='Enter') checkAuth()">

    <label class="remember-row">
      <input type="checkbox" id="rememberMe" checked>
      <span>Запомнить меня на этом устройстве</span>
    </label>

    <button class="btn-submit" id="btnAuth" onclick="checkAuth()">Войти в управление</button>
    <div id="authError" class="status-box status-err" style="margin-top: 14px;"></div>
  </div>


  <!-- ==========================================================
       ЭКРАН 2: ПАНЕЛЬ УПРАВЛЕНИЯ (Открывается после проверки)
       ========================================================== -->
  <div class="card" id="mainAdminCard" style="display: none;">
    <div class="header-row">
      <div class="top-badge" style="margin-bottom: 0;">
        <span class="badge-glow"></span>
        Сервис Контроль
      </div>
      <button class="btn-logout" onclick="logoutAdmin()">Выйти</button>
    </div>

    <h2>Активация стойки</h2>

    <details>
      <summary>▼ Ключи доступа (ввести один раз)</summary>
      <div class="keys-box">
        <label>GitHub Gist ID</label>
        <input type="text" id="gistId" placeholder="Хеш из адресной строки Gist">

        <label>GitHub Personal Token</label>
        <input type="password" id="ghToken" placeholder="ghp_...">
      </div>
    </details>

    <label>Номер стойки (ID из QR)</label>
    <input type="text" id="shopId" placeholder="Например: 001">

    <label>Название точки</label>
    <input type="text" id="shopName" placeholder="Кофейня «Утро»">

    <label>Ссылка на Яндекс.Карты</label>
    <input type="url" id="yandexUrl" placeholder="https://yandex.ru/maps/org/...">

    <label>Ссылка на 2ГИС</label>
    <input type="url" id="gisUrl" placeholder="https://2gis.ru/...">

    <div class="channels-card">
      <div class="channels-header">
        <span class="channels-title">Куда слать негатив</span>
        <span class="channels-hint">Заполните нужные</span>
      </div>

      <label>Telegram (Chat ID)</label>
      <input type="text" id="targetTg" placeholder="Например: 423133556">

      <label>ВКонтакте (VK User ID)</label>
      <input type="text" id="targetVk" placeholder="Например: 74829102">

      <label>Электронная почта (Email)</label>
      <input type="email" id="targetEmail" placeholder="director@company.ru">
    </div>

    <button class="btn-submit" id="btnSave" onclick="saveShop()">Привязать стойку</button>
    <div id="statusBox" class="status-box"></div>
  </div>


  <script>
    // Проверка сохранённой сессии при открытии
    async function initSecurity() {
      const token = localStorage.getItem('sk_admin_token') || sessionStorage.getItem('sk_admin_token');

      if (!token) {
        showLoginScreen();
        return;
      }

      // Проверяем токен сессии на сервере Vercel
      try {
        const res = await fetch('/api/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: token })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          showAdminPanel();
        } else {
          logoutAdmin();
        }
      } catch (err) {
        showLoginScreen();
      }
    }

    // Проверка введенного пароля через /api/auth
    async function checkAuth() {
      const pass = document.getElementById('adminPassInput').value.trim();
      const remember = document.getElementById('rememberMe').checked;
      const errBox = document.getElementById('authError');
      const btn = document.getElementById('btnAuth');

      if (!pass) return;

      btn.disabled = true;
      btn.innerText = 'Проверка...';
      errBox.style.display = 'none';

      try {
        const res = await fetch('/api/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pass })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          const storage = remember ? localStorage : sessionStorage;
          storage.setItem('sk_admin_token', data.token);
          showAdminPanel();
        } else {
          errBox.innerText = data.error || 'Неверный пароль!';
          errBox.style.display = 'block';
          document.getElementById('adminPassInput').value = '';
          document.getElementById('adminPassInput').focus();
        }
      } catch (err) {
        errBox.innerText = 'Сетевая ошибка при проверке';
        errBox.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.innerText = 'Войти в управление';
      }
    }

    function showLoginScreen() {
      document.getElementById('authCard').style.display = 'block';
      document.getElementById('mainAdminCard').style.display = 'none';
      document.getElementById('adminPassInput').focus();
    }

    function showAdminPanel() {
      document.getElementById('authCard').style.display = 'none';
      document.getElementById('mainAdminCard').style.display = 'block';

      // Автозаполнение токенов Gist из личного браузера
      document.getElementById('gistId').value = localStorage.getItem('cfg_gist_id') || '';
      document.getElementById('ghToken').value = localStorage.getItem('cfg_gh_token') || '';
    }

    function logoutAdmin() {
      localStorage.removeItem('sk_admin_token');
      sessionStorage.removeItem('sk_admin_token');
      showLoginScreen();
    }

    // Сохранение стойки в Gist
    async function saveShop() {
      const status = document.getElementById('statusBox');
      const btn = document.getElementById('btnSave');
      status.style.display = 'none';

      const gistId = document.getElementById('gistId').value.trim();
      const token = document.getElementById('ghToken').value.trim();
      const shopId = document.getElementById('shopId').value.trim();
      const name = document.getElementById('shopName').value.trim();
      const yandexUrl = document.getElementById('yandexUrl').value.trim();
      const gisUrl = document.getElementById('gisUrl').value.trim();

      const targetTg = document.getElementById('targetTg').value.trim();
      const targetVk = document.getElementById('targetVk').value.trim();
      const targetEmail = document.getElementById('targetEmail').value.trim();

      if (!gistId || !token || !shopId || !name) {
        showMessage('Заполните номер и название точки, а также Gist ID и токен!', false);
        return;
      }

      if (!yandexUrl && !gisUrl) {
        showMessage('Укажите хотя бы одну ссылку на карты (Яндекс или 2ГИС)!', false);
        return;
      }

      if (!targetTg && !targetVk && !targetEmail) {
        showMessage('Укажите хотя бы один канал (Telegram, VK или Email)!', false);
        return;
      }

      localStorage.setItem('cfg_gist_id', gistId);
      localStorage.setItem('cfg_gh_token', token);

      btn.disabled = true;
      btn.innerText = 'Сохранение в Gist...';

      try {
        const getRes = await fetch(`https://api.github.com/gists/${gistId}`, {
          headers: { 
            'Authorization': `token ${token}`,
            'User-Agent': 'ServisKontrol-Admin'
          }
        });
        
        if (!getRes.ok) throw new Error('Bad credentials');
        
        const gistData = await getRes.json();
        let shops = JSON.parse(gistData.files['shops.json']?.content || '{}');

        // Сохраняем в структуре, строго синхронной с send.js
        shops[shopId] = {
          name: name,
          yandex_url: yandexUrl || null,
          gis_url: gisUrl || null,
          maps_url: yandexUrl || gisUrl || null,
          targets: {
            telegram: targetTg || null,
            vk: targetVk || null,
            email: targetEmail || null
          }
        };

        const patchRes = await fetch(`https://api.github.com/gists/${gistId}`, {
          method: 'PATCH',
          headers: {
            'Authorization': `token ${token}`,
            'Content-Type': 'application/json',
            'User-Agent': 'ServisKontrol-Admin'
          },
          body: JSON.stringify({
            files: { 'shops.json': { content: JSON.stringify(shops, null, 2) } }
          })
        });

        if (patchRes.ok) {
          const qrUrl = `https://servis-kontrol.ru/?id=${shopId}`;
          
          showMessage(`
            <div style="font-weight: 700; color: #34d399; margin-bottom: 4px;">✓ Стойка №${shopId} сохранена!</div>
            <div style="font-size: 11px; color: #94a3b8; margin-bottom: 6px;">Адрес для кодирования в QR-код:</div>
            <div class="link-container">
              <a href="${qrUrl}" target="_blank" class="link-text">${qrUrl}</a>
              <button type="button" class="btn-copy" onclick="copyLink('${qrUrl}', this)">Копировать</button>
            </div>
          `, true);

          document.getElementById('shopId').value = '';
          document.getElementById('shopName').value = '';
          document.getElementById('yandexUrl').value = '';
          document.getElementById('gisUrl').value = '';
          document.getElementById('targetTg').value = '';
          document.getElementById('targetVk').value = '';
          document.getElementById('targetEmail').value = '';
        } else {
          showMessage('Ошибка сохранения: проверьте права токена GitHub', false);
        }
      } catch (e) {
        showMessage('Ошибка доступа к Gist. Проверьте токен и Gist ID', false);
      } finally {
        btn.disabled = false;
        btn.innerText = 'Привязать стойку';
      }
    }

    function showMessage(htmlContent, isSuccess) {
      const el = document.getElementById('statusBox');
      el.className = `status-box ${isSuccess ? 'status-ok' : 'status-err'}`;
      el.innerHTML = htmlContent;
      el.style.display = 'block';
    }

    function copyLink(url, btnElement) {
      navigator.clipboard.writeText(url).then(() => {
        btnElement.innerText = 'Скопировано!';
        setTimeout(() => {
          btnElement.innerText = 'Копировать';
        }, 2000);
      });
    }

    initSecurity();
  </script>
</body>
</html>
