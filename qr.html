<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Печать стойки контроля сервиса</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: #0b0f19;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 16px;
      color: #f8fafc;
    }

    /* Панель управления */
    .controls-panel {
      background: #161e2e;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      padding: 22px;
      width: 100%;
      max-width: 440px;
      margin-bottom: 30px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .controls-panel label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #94a3b8;
      margin-bottom: 6px;
      font-weight: 700;
    }

    .controls-panel input, .controls-panel select {
      width: 100%;
      background: #0b0f19;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 14px;
      color: #fff;
      outline: none;
      margin-bottom: 14px;
    }

    .range-box {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .range-box input[type="range"] {
      margin-bottom: 0;
      padding: 0;
      cursor: pointer;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }

    .btn-action {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-reset {
      background: rgba(244, 63, 94, 0.15);
      color: #fda4af;
      border: 1px solid rgba(244, 63, 94, 0.3);
    }

    .btn-reset:hover {
      background: rgba(244, 63, 94, 0.25);
    }

    .btn-print {
      width: 100%;
      background: #38bdf8;
      color: #0b0f19;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 14px;
      transition: all 0.2s ease;
    }

    .btn-print:hover {
      background: #7dd3fc;
      transform: translateY(-1px);
    }

    /* Рамка и макет 10x15 см */
    .cut-wrapper {
      padding: 15px;
      background: transparent;
      position: relative;
    }

    .stand-card {
      width: 100mm;
      height: 150mm;
      background-color: #ffffff;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      border-radius: 4px;
      position: relative;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      outline: 1px dashed #94a3b8;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: background 0.3s ease;
    }

    /* ================= ВСТРОЕННЫЕ ПРЕСЕТЫ ФОНОВ ================= */
    /* 1. Белый чистый минимализм */
    .preset-white {
      background: #ffffff !important;
    }

    /* 2. Тёплый крафт (Пекарня / Кофейня) */
    .preset-kraft {
      background-color: #f7efe3 !important;
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.45) 0%, rgba(224, 207, 184, 0.4) 100%),
        repeating-linear-gradient(45deg, rgba(160, 120, 80, 0.03) 0px, rgba(160, 120, 80, 0.03) 2px, transparent 2px, transparent 4px) !important;
    }

    /* 3. Тёмный сланец / Графит (Рестораны / Барбершопы) */
    .preset-slate {
      background-color: #12161f !important;
      background-image: 
        radial-gradient(circle at 50% 20%, #202736 0%, #10141c 70%, #090b10 100%),
        repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.015) 0px, rgba(255, 255, 255, 0.015) 1px, transparent 1px, transparent 2px) !important;
    }

    /* 4. Бьюти / Пудровый (Салоны красоты / Косметология) */
    .preset-beauty {
      background-color: #fdf5f4 !important;
      background-image: 
        radial-gradient(circle at 10% 20%, #fff0ed 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, #fbe4e1 0%, transparent 50%),
        linear-gradient(135deg, #fffaf9 0%, #faecea 100%) !important;
    }

    /* 5. Карбон / Dark Tech (Авто / Детейлинг) */
    .preset-auto {
      background-color: #0f1217 !important;
      background-image: 
        radial-gradient(circle at 50% 30%, rgba(30, 41, 59, 0.8) 0%, rgba(15, 18, 23, 0.95) 100%),
        radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px) !important;
      background-size: 100% 100%, 10px 10px !important;
    }

    /* 6. Ментол / Медицина (Клиники / Аптеки / Стоматологии) */
    .preset-med {
      background-color: #f0fdfa !important;
      background-image: 
        radial-gradient(circle at 80% 10%, #ccfbf1 0%, transparent 50%),
        radial-gradient(circle at 20% 90%, #e6fffa 0%, transparent 50%),
        linear-gradient(180deg, #ffffff 0%, #f0fdfa 100%) !important;
    }

    /* Полупрозрачный слой затемнения */
    .bg-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0);
      pointer-events: none;
      transition: background 0.2s ease;
    }

    /* Контейнер элементов */
    .card-content {
      position: relative;
      z-index: 2;
      height: 100%;
      padding: 11mm 10mm 8mm 10mm;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
    }

    /* --- ТЁМНЫЙ ТЕКСТ (Светлые темы) --- */
    .main-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      line-height: 1.15;
      text-transform: uppercase;
      color: #111827;
    }

    .sub-text {
      font-size: 11.5px;
      font-weight: 700;
      color: #374151;
      margin-top: 6px;
      line-height: 1.35;
    }

    .hint-label {
      font-size: 9.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #0369a1;
      margin-bottom: 6px;
    }

    .footer-text {
      font-size: 9px;
      font-weight: 800;
      color: #4b5563;
      letter-spacing: 1px;
      text-transform: uppercase;
      width: 100%;
      display: flex;
      justify-content: space-between;
      margin-top: 4px;
    }

    /* --- СВЕТЛЫЙ ТЕКСТ (Тёмные темы) --- */
    .text-light .main-title {
      color: #ffffff !important;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
    }
    .text-light .sub-text {
      color: rgba(255, 255, 255, 0.95) !important;
      text-shadow: 0 1px 5px rgba(0, 0, 0, 0.6);
    }
    .text-light .hint-label {
      color: #38bdf8 !important;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
    }
    .text-light .footer-text {
      color: rgba(255, 255, 255, 0.8) !important;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
    }

    .stars-box {
      color: #f59e0b;
      font-size: 20px;
      letter-spacing: 4px;
      line-height: 1;
      margin-bottom: 8px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.2);
    }

    /* Подложка QR-кода */
    .qr-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 2mm 0;
      background: #ffffff;
      padding: 10px;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
    }

    .scan-hint-block {
      width: 100%;
      padding-top: 6px;
    }

    .logos-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .badge-card {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(0, 0, 0, 0.08);
      color: #0f172a;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }

    /* Настройки прямой печати */
    @media print {
      @page {
        margin: 0;
        size: auto;
      }

      body {
        background: transparent !important;
        padding: 0 !important;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .no-print {
        display: none !important;
      }

      .cut-wrapper {
        box-shadow: none !important;
        padding: 0;
      }

      .stand-card {
        box-shadow: none !important;
        margin: 0 auto;
        page-break-inside: avoid;
        outline: 0.5px dashed #94a3b8 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
    }
  </style>
</head>
<body>

  <!-- Панель управления -->
  <div class="controls-panel no-print">
    <label>Готовый стиль фона</label>
    <select id="presetSelect" onchange="applyPreset(this.value)">
      <option value="preset-white" selected>Чистый минимализм (Белый)</option>
      <option value="preset-kraft">Тёплый крафт (Пекарня / Кофейня)</option>
      <option value="preset-slate">Тёмный сланец / Графит (Рестораны / Барбершопы)</option>
      <option value="preset-beauty">Пудровый мрамор (Салоны красоты / Спа)</option>
      <option value="preset-auto">Тёмный карбон (Автосервисы / Детейлинг)</option>
      <option value="preset-med">Свежий ментол (Клиники / Аптеки / Стоматология)</option>
    </select>

    <label>Или загрузить свой фон</label>
    <input type="file" id="bgInput" accept="image/*" onchange="handleBgUpload(event)">

    <label>Затемнение фона (<span id="dimVal">0%</span>)</label>
    <div class="range-box">
      <input type="range" id="dimRange" min="0" max="85" value="0" oninput="changeDim(this.value)">
    </div>

    <label>Цвет надписей</label>
    <select id="textColorSelect" onchange="changeTextColor(this.value)">
      <option value="dark" selected>Тёмный текст (для светлых фонов)</option>
      <option value="light">Светлый текст (для тёмных фонов)</option>
    </select>

    <label>Номер стойки (ID)</label>
    <input type="text" id="inId" value="001" oninput="updateCard()">

    <div class="btn-row">
      <button type="button" class="btn-action btn-reset" onclick="resetBg()">Сбросить к белому</button>
    </div>

    <button class="btn-print" onclick="window.print()">Распечатать макет</button>
  </div>

  <!-- Печатный бланк (10 × 15 см) -->
  <div class="cut-wrapper">
    <div class="stand-card preset-white" id="card">
      <div class="bg-overlay" id="overlay"></div>

      <div class="card-content" id="cardContent">
        <div>
          <div class="stars-box">★★★★★</div>
          <div class="main-title">Оцените<br>наш сервис</div>
          <div class="sub-text">Поделитесь впечатлениями о визите</div>
        </div>

        <div class="qr-wrapper">
          <div id="qrcode"></div>
        </div>

        <div class="scan-hint-block">
          <div class="hint-label">Наведите камеру смартфона</div>
          <div class="logos-container">
            <div class="badge-card">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none">
                <rect width="24" height="24" rx="12" fill="#FC3F1D"/>
                <path d="M13.5 6.5H11.8C9.9 6.5 8.7 7.7 8.7 9.4C8.7 10.8 9.5 11.8 10.7 12.3L8.5 17.5H10.8L12.7 13H13.6V17.5H15.5V6.5H13.5ZM11.8 11.2C10.9 11.2 10.4 10.5 10.4 9.5C10.4 8.5 11 7.9 11.8 7.9H13.6V11.2H11.8Z" fill="white"/>
              </svg>
              Яндекс Карты
            </div>
            <div class="badge-card">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none">
                <rect width="24" height="24" rx="6" fill="#00A651"/>
                <path d="M6 7H13C14.7 7 16 8.3 16 10C16 11.7 14.7 13 13 13H8.5V17H6V7ZM8.5 11H13C13.6 11 14 10.6 14 10C14 9.4 13.6 9 13 9H8.5V11Z" fill="white"/>
                <circle cx="17.5" cy="16.5" r="1.5" fill="white"/>
              </svg>
              2ГИС
            </div>
          </div>
        </div>

        <div class="footer-text">
          <span>servis-kontrol.ru</span>
          <span id="cardId">№ 001</span>
        </div>
      </div>

    </div>
  </div>

  <script>
    const allPresets = ['preset-white', 'preset-kraft', 'preset-slate', 'preset-beauty', 'preset-auto', 'preset-med'];

    function applyPreset(presetClass) {
      const card = document.getElementById('card');
      card.style.backgroundImage = 'none'; // сброс загруженного файла
      document.getElementById('bgInput').value = '';

      allPresets.forEach(cls => card.classList.remove(cls));
      card.classList.add(presetClass);

      // Автоматическое переключение контраста текста
      if (presetClass === 'preset-slate' || presetClass === 'preset-auto') {
        document.getElementById('textColorSelect').value = 'light';
        changeTextColor('light');
      } else {
        document.getElementById('textColorSelect').value = 'dark';
        changeTextColor('dark');
      }
    }

    function handleBgUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const card = document.getElementById('card');
        allPresets.forEach(cls => card.classList.remove(cls));
        card.style.backgroundImage = `url('${evt.target.result}')`;
      };
      reader.readAsDataURL(file);
    }

    function changeDim(val) {
      document.getElementById('dimVal').innerText = `${val}%`;
      document.getElementById('overlay').style.background = `rgba(0, 0, 0, ${val / 100})`;
    }

    function changeTextColor(val) {
      const content = document.getElementById('cardContent');
      if (val === 'light') {
        content.classList.add('text-light');
      } else {
        content.classList.remove('text-light');
      }
    }

    function resetBg() {
      document.getElementById('presetSelect').value = 'preset-white';
      applyPreset('preset-white');
      document.getElementById('dimRange').value = 0;
      changeDim(0);
    }

    function updateCard() {
      const id = document.getElementById('inId').value.trim() || '001';
      document.getElementById('cardId').innerText = `№ ${id}`;

      const targetUrl = `https://servis-kontrol.ru/?id=${encodeURIComponent(id)}`;
      const qrBox = document.getElementById('qrcode');
      qrBox.innerHTML = '';

      new QRCode(qrBox, {
        text: targetUrl,
        width: 165,
        height: 165,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });
    }

    updateCard();
  </script>
</body>
</html>
