<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Генератор полиграфии контроля сервиса</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: #0b0f19;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 16px;
      color: #f8fafc;
    }

    .controls-panel {
      background: #161e2e;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      padding: 22px;
      width: 100%;
      max-width: 460px;
      margin-bottom: 30px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .controls-panel label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #94a3b8;
      margin-bottom: 6px;
      font-weight: 700;
    }

    .controls-panel input, .controls-panel select {
      width: 100%;
      background: #0b0f19;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 14px;
      color: #fff;
      outline: none;
      margin-bottom: 14px;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      cursor: pointer;
    }

    .checkbox-row input {
      width: auto;
      margin-bottom: 0;
      cursor: pointer;
    }

    .checkbox-row span {
      font-size: 13px;
      font-weight: 600;
      color: #e2e8f0;
    }

    .range-box {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .range-box input[type="range"] {
      margin-bottom: 0;
      padding: 0;
      cursor: pointer;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }

    .btn-action {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-reset {
      background: rgba(244, 63, 94, 0.15);
      color: #fda4af;
      border: 1px solid rgba(244, 63, 94, 0.3);
    }

    .btn-reset:hover {
      background: rgba(244, 63, 94, 0.25);
    }

    .btn-print {
      width: 100%;
      background: #38bdf8;
      color: #0b0f19;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 14px;
      transition: all 0.2s ease;
    }

    .btn-print:hover {
      background: #7dd3fc;
      transform: translateY(-1px);
    }

    .cut-wrapper {
      padding: 15px;
      background: transparent;
      position: relative;
    }

    .stand-card {
      background-color: #000000;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      position: relative;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: width 0.2s ease, height 0.2s ease;
    }

    /* ФОРМАТЫ */
    .format-a6 {
      width: 105mm;
      height: 148mm;
    }
    .format-a6 .card-content { padding: 9mm 10mm 7mm 10mm; }
    .format-a6 .main-title { font-size: 21px; }
    .format-a6 .sub-text { font-size: 11px; }
    .format-a6 .stars-box { font-size: 19px; letter-spacing: 4px; margin-bottom: 5px; }
    .format-a6 .hint-label { font-size: 9px; margin-bottom: 6px; }
    .format-a6 .badge-card { font-size: 10px; padding: 4px 8px; gap: 6px; border-radius: 6px; }
    .format-a6 .badge-card svg { width: 14px; height: 14px; }
    .format-a6 .footer-text { font-size: 8.5px; }
    .format-a6 .qr-wrapper { padding: 9px; border-radius: 14px; margin: 1mm 0 2mm 0; }
    .format-a6 .nfc-badge { font-size: 8px; padding: 2px 7px; top: -10px; gap: 4px; }
    .format-a6 .nfc-badge svg { width: 10px; height: 10px; }

    .format-a5 {
      width: 148mm;
      height: 210mm;
    }
    .format-a5 .card-content { padding: 14mm 13mm 10mm 13mm; }
    .format-a5 .main-title { font-size: 31px; }
    .format-a5 .sub-text { font-size: 15.5px; margin-top: 8px; }
    .format-a5 .stars-box { font-size: 27px; letter-spacing: 6px; margin-bottom: 10px; }
    .format-a5 .hint-label { font-size: 12.5px; margin-bottom: 8px; }
    .format-a5 .badge-card { font-size: 13px; padding: 6px 12px; gap: 7px; border-radius: 8px; }
    .format-a5 .badge-card svg { width: 18px; height: 18px; }
    .format-a5 .footer-text { font-size: 11.5px; }
    .format-a5 .qr-wrapper { padding: 13px; border-radius: 18px; margin: 2mm 0 3mm 0; }
    .format-a5 .nfc-badge { font-size: 10.5px; padding: 3px 10px; top: -13px; gap: 5px; }
    .format-a5 .nfc-badge svg { width: 13px; height: 13px; }

    .format-a4 {
      width: 210mm;
      height: 297mm;
    }
    .format-a4 .card-content { padding: 20mm 18mm 15mm 18mm; }
    .format-a4 .main-title { font-size: 44px; }
    .format-a4 .sub-text { font-size: 21px; margin-top: 12px; }
    .format-a4 .stars-box { font-size: 38px; letter-spacing: 8px; margin-bottom: 14px; }
    .format-a4 .hint-label { font-size: 17.5px; margin-bottom: 12px; }
    .format-a4 .badge-card { font-size: 18px; padding: 9px 18px; gap: 10px; border-radius: 12px; }
    .format-a4 .badge-card svg { width: 24px; height: 24px; }
    .format-a4 .footer-text { font-size: 15.5px; }
    .format-a4 .qr-wrapper { padding: 17px; border-radius: 24px; margin: 4mm 0 5mm 0; }
    .format-a4 .nfc-badge { font-size: 14px; padding: 4px 14px; top: -17px; gap: 7px; }
    .format-a4 .nfc-badge svg { width: 18px; height: 18px; }

    .format-a3 {
      width: 297mm;
      height: 420mm;
    }
    .format-a3 .card-content { padding: 28mm 25mm 20mm 25mm; }
    .format-a3 .main-title { font-size: 62px; }
    .format-a3 .sub-text { font-size: 29px; margin-top: 16px; }
    .format-a3 .stars-box { font-size: 54px; letter-spacing: 12px; margin-bottom: 20px; }
    .format-a3 .hint-label { font-size: 23px; margin-bottom: 16px; }
    .format-a3 .badge-card { font-size: 24px; padding: 12px 24px; gap: 14px; border-radius: 16px; }
    .format-a3 .badge-card svg { width: 32px; height: 32px; }
    .format-a3 .footer-text { font-size: 21px; }
    .format-a3 .qr-wrapper { padding: 23px; border-radius: 32px; margin: 6mm 0 8mm 0; }
    .format-a3 .nfc-badge { font-size: 19px; padding: 6px 20px; top: -24px; gap: 9px; }
    .format-a3 .nfc-badge svg { width: 25px; height: 25px; }

    /* ПРЕСЕТЫ */
    .preset-black { background: #000000 !important; }
    .preset-white { background: #ffffff !important; }
    .preset-kraft {
      background-color: #f7efe3 !important;
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.45) 0%, rgba(224, 207, 184, 0.4) 100%),
        repeating-linear-gradient(45deg, rgba(160, 120, 80, 0.03) 0px, rgba(160, 120, 80, 0.03) 2px, transparent 2px, transparent 4px) !important;
    }
    .preset-slate {
      background-color: #12161f !important;
      background-image: 
        radial-gradient(circle at 50% 20%, #202736 0%, #10141c 70%, #090b10 100%) !important;
    }
    .preset-beauty {
      background-color: #fdf5f4 !important;
      background-image: 
        radial-gradient(circle at 10% 20%, #fff0ed 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, #fbe4e1 0%, transparent 50%),
        linear-gradient(135deg, #fffaf9 0%, #faecea 100%) !important;
    }
    .preset-auto {
      background-color: #0f1217 !important;
      background-image: 
        radial-gradient(circle at 50% 30%, rgba(30, 41, 59, 0.8) 0%, rgba(15, 18, 23, 0.95) 100%),
        radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px) !important;
      background-size: 100% 100%, 10px 10px !important;
    }
    .preset-med {
      background-color: #f0fdfa !important;
      background-image: 
        radial-gradient(circle at 80% 10%, #ccfbf1 0%, transparent 50%),
        radial-gradient(circle at 20% 90%, #e6fffa 0%, transparent 50%),
        linear-gradient(180deg, #ffffff 0%, #f0fdfa 100%) !important;
    }

    .bg-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0);
      pointer-events: none;
      transition: background 0.2s ease;
    }

    .card-content {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
    }

    .main-title {
      font-weight: 800;
      letter-spacing: -0.5px;
      line-height: 1.15;
      text-transform: uppercase;
      color: #111827;
    }

    .sub-text {
      font-weight: 700;
      color: #374151;
      line-height: 1.35;
    }

    .stars-box {
      color: #f59e0b;
      line-height: 1;
      text-shadow: 0 1px 4px rgba(0,0,0,0.2);
    }

    .hint-label {
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #0369a1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .footer-text {
      font-weight: 800;
      color: #4b5563;
      letter-spacing: 1px;
      text-transform: uppercase;
      width: 100%;
      display: flex;
      justify-content: space-between;
    }

    .text-light .main-title {
      color: #ffffff !important;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
    }
    .text-light .sub-text {
      color: rgba(255, 255, 255, 0.95) !important;
      text-shadow: 0 1px 5px rgba(0, 0, 0, 0.6);
    }
    .text-light .hint-label {
      color: #38bdf8 !important;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
    }
    .text-light .footer-text {
      color: rgba(255, 255, 255, 0.8) !important;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
    }

    /* Подложка QR-кода с индикатором NFC */
    .qr-wrapper {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffffff;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
    }

    /* Наклейка-мишень NFC */
    .nfc-badge {
      position: absolute;
      background: #0284c7;
      color: #ffffff;
      border-radius: 99px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      display: flex;
      align-items: center;
      box-shadow: 0 3px 10px rgba(2, 132, 199, 0.45);
      border: 1.5px solid #ffffff;
    }

    .nfc-badge svg {
      fill: currentColor;
    }

    .scan-hint-block { width: 100%; }

    .logos-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .badge-card {
      display: inline-flex;
      align-items: center;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(0, 0, 0, 0.08);
      color: #0f172a;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }

    @media print {
      @page {
        margin: 0 !important;
        size: auto;
      }

      html, body {
        background: transparent !important;
        padding: 0 !important;
        margin: 0 !important;
        width: 100% !important;
        height: 100% !important;
        overflow: hidden !important;
      }

      .no-print { display: none !important; }
      
      .cut-wrapper { 
        box-shadow: none !important; 
        padding: 0 !important; 
        margin: 0 !important;
        width: 100% !important;
        height: 100% !important;
      }

      .stand-card {
        box-shadow: none !important;
        outline: none !important;
        margin: 0 !important;
        page-break-inside: avoid !important;
        page-break-after: avoid !important;
        break-inside: avoid !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
    }
  </style>
</head>
<body>

  <div class="controls-panel no-print">
    <label>Формат полиграфии</label>
    <select id="formatSelect" onchange="changeFormat(this.value)">
      <option value="a6" selected>А6 (105 × 148 мм — Настольная стойка / Тейбл-тент)</option>
      <option value="a5">А5 (148 × 210 мм — Большой ресепшен)</option>
      <option value="a4">А4 (210 × 297 мм — Настенный лист / Рамка)</option>
      <option value="a3">А3 (297 × 420 мм — Большой постер на стену)</option>
    </select>

    <label class="checkbox-row">
      <input type="checkbox" id="nfcCheckbox" checked onchange="toggleNfc(this.checked)">
      <span>Метка NFC (показать метку зоны касания на QR-коде)</span>
    </label>

    <label>Готовый стиль фона</label>
    <select id="presetSelect" onchange="applyPreset(this.value)">
      <option value="preset-black" selected>Глубокий чёрный (True Black #000000)</option>
      <option value="preset-white">Чистый минимализм (Белый)</option>
      <option value="preset-kraft">Тёплый крафт (Пекарня / Кофейня)</option>
      <option value="preset-slate">Тёмный сланец / Графит</option>
      <option value="preset-beauty">Пудровый мрамор (Салоны красоты / Спа)</option>
      <option value="preset-auto">Тёмный карбон (Автосервисы / Детейлинг)</option>
      <option value="preset-med">Свежий ментол (Клиники / Стоматология)</option>
    </select>

    <label>Или загрузить свой фон</label>
    <input type="file" id="bgInput" accept="image/*" onchange="handleBgUpload(event)">

    <label>Затемнение фона (<span id="dimVal">0%</span>)</label>
    <div class="range-box">
      <input type="range" id="dimRange" min="0" max="85" value="0" oninput="changeDim(this.value)">
    </div>

    <label>Цвет надписей</label>
    <select id="textColorSelect" onchange="changeTextColor(this.value)">
      <option value="light" selected>Светлый текст (для тёмных фонов)</option>
      <option value="dark">Тёмный текст (для светлых фонов)</option>
    </select>

    <label>Номер стойки (ID)</label>
    <input type="text" id="inId" value="001" oninput="updateCard()">

    <div class="btn-row">
      <button type="button" class="btn-action btn-reset" onclick="resetBg()">Сбросить к чёрному</button>
    </div>

    <button class="btn-print" onclick="window.print()">Распечатать макет</button>
  </div>

  <div class="cut-wrapper">
    <div class="stand-card format-a6 preset-black" id="card">
      <div class="bg-overlay" id="overlay"></div>

      <div class="card-content text-light" id="cardContent">
        <div>
          <div class="stars-box">★★★★★</div>
          <div class="main-title">Оцените<br>наш сервис</div>
          <div class="sub-text">Поделитесь впечатлениями о визите</div>
        </div>

        <!-- QR контейнер со значком NFC мишени -->
        <div class="qr-wrapper">
          <div class="nfc-badge" id="nfcBadge">
            <svg viewBox="0 0 24 24">
              <path d="M12 4C14.21 4 16.21 4.89 17.66 6.34L16.24 7.76C15.16 6.67 13.66 6 12 6C10.34 6 8.84 6.67 7.76 7.76L6.34 6.34C7.79 4.89 9.79 4 12 4ZM12 8C13.1 8 14.1 8.45 14.83 9.17L13.41 10.59C13.05 10.22 12.55 10 12 10C11.45 10 10.95 10.22 10.59 10.59L9.17 9.17C9.9 8.45 10.9 8 12 8ZM12 12C12.55 12 13 12.45 13 13C13 13.55 12.55 14 12 14C11.45 14 11 13.55 11 13C11 12.45 11.45 12 12 12ZM12 0C15.31 0 18.31 1.34 20.49 3.51L19.07 4.93C17.26 3.11 14.76 2 12 2C9.24 2 6.74 3.11 4.93 4.93L3.51 3.51C5.69 1.34 8.69 0 12 0Z"/>
            </svg>
            <span>NFC: приложите сюда</span>
          </div>
          <div id="qrcode"></div>
        </div>

        <div class="scan-hint-block">
          <div class="hint-label" id="hintLabel">Приложите телефон к QR-коду или отсканируйте</div>

          <div class="logos-container">
            <!-- Геометка Яндекс Карт -->
            <div class="badge-card">
              <svg viewBox="0 0 24 24" fill="none">
                <path fill-rule="evenodd" clip-rule="evenodd" d="M12 1.2C7.03 1.2 3 5.23 3 10.2C3 14.5 6.5 18.2 10.6 20.9C11.2 21.3 11.5 21.8 11.6 22.4C11.7 22.7 11.8 22.8 12 22.8C12.2 22.8 12.3 22.7 12.4 22.4C12.5 21.8 12.8 21.3 13.4 20.9C17.5 18.2 21 14.5 21 10.2C21 5.23 16.97 1.2 12 1.2ZM12 6.4C14.1 6.4 15.8 8.1 15.8 10.2C15.8 12.3 14.1 14 12 14C9.9 14 8.2 12.3 8.2 10.2C8.2 8.1 9.9 6.4 12 6.4Z" fill="#FC3F1D"/>
              </svg>
              Яндекс Карты
            </div>
            
            <!-- Логотип 2ГИС -->
            <div class="badge-card">
              <svg viewBox="0 0 24 24" fill="none">
                <defs>
                  <clipPath id="twogis-clip">
                    <rect width="24" height="24" rx="6" />
                  </clipPath>
                </defs>
                <g clip-path="url(#twogis-clip)">
                  <rect width="24" height="24" fill="#189e28" />
                  <path d="M-1 -1 H25 V8.5 L-1 5 Z" fill="#f59f1c" />
                  <line x1="-1" y1="5" x2="25" y2="8.5" stroke="#ffffff" stroke-width="1.2" />
                  <path d="M-1 19 L25 16.5 V25 H-1 Z" fill="#89cf26" />
                  <line x1="-1" y1="19" x2="25" y2="16.5" stroke="#ffffff" stroke-width="1.2" />
                  <path d="M12 4.8 A 5.3 5.3 0 0 1 17.2 12.2 A 2.2 2.2 0 0 0 13.5 14.2 V 18.5 H 10.5 V 14.2 A 2.2 2.2 0 0 0 6.8 12.2 A 5.3 5.3 0 0 1 12 4.8 Z" 
                        stroke="#ffffff" stroke-width="1.8" stroke-linejoin="round" fill="#0b75f5" />
                </g>
              </svg>
              2ГИС
            </div>
          </div>
        </div>

        <div class="footer-text">
          <span>servis-kontrol.ru</span>
          <span id="cardId">№ 001</span>
        </div>
      </div>

    </div>
  </div>

  <script>
    const allPresets = ['preset-black', 'preset-white', 'preset-kraft', 'preset-slate', 'preset-beauty', 'preset-auto', 'preset-med'];
    const allFormats = ['format-a6', 'format-a5', 'format-a4', 'format-a3'];
    let currentFormat = 'a6';

    const qrSizes = {
      'a6': 165,
      'a5': 230,
      'a4': 320,
      'a3': 460
    };

    function toggleNfc(enabled) {
      const badge = document.getElementById('nfcBadge');
      const hint = document.getElementById('hintLabel');
      if (enabled) {
        badge.style.display = 'flex';
        hint.innerText = 'Приложите телефон к QR-коду или отсканируйте';
      } else {
        badge.style.display = 'none';
        hint.innerText = 'Наведите камеру смартфона';
      }
    }

    function changeFormat(fmt) {
      currentFormat = fmt;
      const card = document.getElementById('card');
      allFormats.forEach(f => card.classList.remove(f));
      card.classList.add(`format-${fmt}`);
      updateCard();
    }

    function applyPreset(presetClass) {
      const card = document.getElementById('card');
      card.style.backgroundImage = 'none';
      document.getElementById('bgInput').value = '';

      allPresets.forEach(cls => card.classList.remove(cls));
      card.classList.add(presetClass);

      if (presetClass === 'preset-black' || presetClass === 'preset-slate' || presetClass === 'preset-auto') {
        document.getElementById('textColorSelect').value = 'light';
        changeTextColor('light');
      } else {
        document.getElementById('textColorSelect').value = 'dark';
        changeTextColor('dark');
      }
    }

    function handleBgUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const card = document.getElementById('card');
        allPresets.forEach(cls => card.classList.remove(cls));
        card.style.backgroundImage = `url('${evt.target.result}')`;
      };
      reader.readAsDataURL(file);
    }

    function changeDim(val) {
      document.getElementById('dimVal').innerText = `${val}%`;
      document.getElementById('overlay').style.background = `rgba(0, 0, 0, ${val / 100})`;
    }

    function changeTextColor(val) {
      const content = document.getElementById('cardContent');
      if (val === 'light') {
        content.classList.add('text-light');
      } else {
        content.classList.remove('text-light');
      }
    }

    function resetBg() {
      document.getElementById('presetSelect').value = 'preset-black';
      applyPreset('preset-black');
      document.getElementById('dimRange').value = 0;
      changeDim(0);
    }

    function updateCard() {
      const id = document.getElementById('inId').value.trim() || '001';
      document.getElementById('cardId').innerText = `№ ${id}`;

      const targetUrl = `https://servis-kontrol.ru/?id=${encodeURIComponent(id)}`;
      const qrBox = document.getElementById('qrcode');
      qrBox.innerHTML = '';

      const size = qrSizes[currentFormat] || 165;

      new QRCode(qrBox, {
        text: targetUrl,
        width: size,
        height: size,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });
    }

    updateCard();
  </script>
</body>
</html>
